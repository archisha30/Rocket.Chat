<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Rocket.Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            height: 700px;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #ef233c 0%, #d90429 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .skip-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .skip-btn:hover {
            background: white;
            color: #ef233c;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .header-info h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .header-info p {
            font-size: 13px;
            opacity: 0.9;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ef233c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #667eea;
        }

        .message-content {
            max-width: 75%;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            white-space: pre-line;
            line-height: 1.5;
        }

        .message.bot .message-bubble {
            background: white;
            color: #2b2d42;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .option-btn {
            background: white;
            color: #ef233c;
            border: 2px solid #ef233c;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 14px;
        }

        .option-btn:hover {
            background: #ef233c;
            color: white;
            transform: translateX(4px);
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: none;
        }

        .input-area.active {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #ef233c;
        }

        .input-area button {
            background: #ef233c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-area button:hover {
            background: #d90429;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef233c;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">🤖</div>
            <div class="header-info">
                <h2>Rocket.Chat Onboarding Bot</h2>
                <p>● Online • Personalizing your experience</p>
            </div>
            <a href="/" class="skip-btn">Skip to App</a>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area" id="inputArea">
            <input type="text" id="userInput" placeholder="Type your answer...">
            <button onclick="submitInput()">Send</button>
        </div>
    </div>

    <script>
        let userProfile = {};
        let currentQuestion = 0;
        let waitingForInput = false;

        const questions = [
            {
                text: "👋 Hi there! Welcome to Rocket.Chat!\n\nI'm your personal onboarding assistant. Let's get you set up!\n\nFirst, what should I call you? 😊",
                type: 'input',
                key: 'name'
            },
            {
                text: "Nice to meet you, {name}! 🤝\n\nWhat's your role?",
                type: 'options',
                key: 'role',
                options: [
                    '👨‍💼 Team Leader',
                    '👨‍💻 Developer',
                    '🎨 Designer',
                    '📊 Product Manager',
                    '💼 Business/Sales',
                    '🎓 Student'
                ]
            },
            {
                text: "Awesome! How experienced are you with team chat tools?",
                type: 'options',
                key: 'experience',
                options: [
                    '🆕 Brand new to this',
                    '📚 Used a few before',
                    '⭐ Pretty experienced',
                    '🚀 Expert level'
                ]
            },
            {
                text: "Got it! How big is your team?",
                type: 'options',
                key: 'teamSize',
                options: [
                    'Just me',
                    '2-10 people',
                    '11-50 people',
                    '50+ people'
                ]
            },
            {
                text: "What features are you most interested in?",
                type: 'options',
                key: 'interests',
                options: [
                    '💬 Team Communication',
                    '📹 Video Calls',
                    '📁 File Sharing',
                    '🤖 Automation & Bots',
                    '🔒 Security & Privacy'
                ]
            }
        ];

        function addMessage(text, sender = 'bot', options = null) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            let html = `
                <div class="message-avatar">${sender === 'bot' ? '🤖' : '👤'}</div>
                <div class="message-content">
                    <div class="message-bubble">${text}</div>
            `;
            
            if (options) {
                html += '<div class="options">';
                options.forEach(option => {
                    html += `<button class="option-btn" onclick="handleOption('${escapeHtml(option)}')">${option}</button>`;
                });
                html += '</div>';
            }
            
            html += '</div>';
            messageDiv.innerHTML = html;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('messages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="message-bubble">
                        <div class="typing">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        function showInput() {
            document.getElementById('inputArea').classList.add('active');
            document.getElementById('userInput').focus();
            waitingForInput = true;
        }

        function hideInput() {
            document.getElementById('inputArea').classList.remove('active');
            document.getElementById('userInput').value = '';
            waitingForInput = false;
        }

        function submitInput() {
            const input = document.getElementById('userInput');
            const value = input.value.trim();
            
            if (value) {
                handleOption(value);
                hideInput();
            }
        }

        function askQuestion(index) {
            if (index >= questions.length) {
                showSummary();
                return;
            }

            currentQuestion = index;
            const q = questions[index];
            let text = q.text;

            Object.keys(userProfile).forEach(key => {
                text = text.replace(`{${key}}`, userProfile[key]);
            });

            showTyping();
            setTimeout(() => {
                hideTyping();
                
                if (q.type === 'input') {
                    addMessage(text);
                    setTimeout(() => showInput(), 300);
                } else {
                    addMessage(text, 'bot', q.options);
                }
            }, 1000);
        }

        function handleOption(answer) {
            addMessage(answer, 'user');
            
            const q = questions[currentQuestion];
            userProfile[q.key] = answer;

            showTyping();
            setTimeout(() => {
                hideTyping();
                
                let ack = "Got it! ✅";
                if (q.key === 'name') {
                    ack = `Great to meet you, ${answer}! 🤝`;
                }
                
                addMessage(ack);
                
                setTimeout(() => {
                    askQuestion(currentQuestion + 1);
                }, 1000);
            }, 800);
        }

        function showSummary() {
            showTyping();
            setTimeout(() => {
                hideTyping();
                addMessage(`🎉 Perfect! I've got everything I need, ${userProfile.name}!`);
                
                setTimeout(() => {
                    addMessage(
                        "Ready to start chatting?",
                        'bot',
                        [
                            '🚀 Take Me to Rocket.Chat',
                            '🔄 Start Over'
                        ]
                    );
                }, 1500);
            }, 1000);
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'");
        }

        // Handle special actions
        window.handleOption = function(answer) {
            if (answer === '🚀 Take Me to Rocket.Chat') {
                localStorage.setItem('hasSeenChatbot', 'true');
                localStorage.setItem('userProfile', JSON.stringify(userProfile));
                window.location.href = '/';
                return;
            }
            
            if (answer === '🔄 Start Over') {
                location.reload();
                return;
            }
            
            handleOption(answer);
        };

        // Handle Enter key
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('userInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitInput();
            });
            
            // Check if user has already seen chatbot
            if (localStorage.getItem('hasSeenChatbot') === 'true') {
                window.location.href = '/';
                return;
            }
            
            // Start the chatbot
            setTimeout(() => askQuestion(0), 500);
        });
    </script>
</body>
</html>
