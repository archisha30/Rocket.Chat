apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketchat-config
  namespace: rocketchat
data:
  ROOT_URL: "http://rocketchat.local"
  PORT: "3000"
  MONGO_URL: "mongodb://rocketchat:rocketchat123@mongodb:27017/rocketchat?authSource=admin"
  MONGO_OPLOG_URL: "mongodb://rocketchat:rocketchat123@mongodb:27017/local?authSource=admin"
---
apiVersion: v1
kind: Service
metadata:
  name: rocketchat
  namespace: rocketchat
  labels:
    app: rocketchat
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: rocketchat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketchat
  namespace: rocketchat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rocketchat
  template:
    metadata:
      labels:
        app: rocketchat
    spec:
      containers:
        - name: rocketchat
          image: registry.rocket.chat/rocketchat/rocket.chat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: ROOT_URL
              valueFrom:
                configMapKeyRef:
                  name: rocketchat-config
                  key: ROOT_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: rocketchat-config
                  key: PORT
            - name: MONGO_URL
              valueFrom:
                configMapKeyRef:
                  name: rocketchat-config
                  key: MONGO_URL
            - name: MONGO_OPLOG_URL
              valueFrom:
                configMapKeyRef:
                  name: rocketchat-config
                  key: MONGO_OPLOG_URL
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/info
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/info
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
